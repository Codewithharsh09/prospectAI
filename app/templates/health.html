<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProspectAI — Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #eef2f7;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 700px;
    }

    /* Decorative stars */
    .star {
      position: absolute;
      font-size: 1.6rem;
      color: #f59e0b;
      pointer-events: none;
      line-height: 1;
    }
    .star-tl { top: -28px; left: -10px; }
    .star-br { bottom: -32px; right: -8px; font-size: 2rem; }

    /* Card */
    .card {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,.10);
    }

    /* Header */
    .card-header {
      background: #00c9a7;
      padding: 13px 28px;
      text-align: center;
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    /* Main body */
    .card-body {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 2rem 2rem 1.75rem;
    }

    /* ── Left: overall score ── */
    .score-col {
      flex: 0 0 190px;
      text-align: center;
      padding-right: 2rem;
    }

    .col-title {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 1.1rem;
    }

    .ring-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ring-wrap .center-num {
      position: absolute;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .score-rating {
      margin-top: .7rem;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .score-range {
      margin-top: .25rem;
      font-size: .68rem;
      color: #94a3b8;
    }

    /* ── Divider ── */
    .vdivider {
      width: 1px;
      height: 160px;
      background: #e8edf3;
      flex-shrink: 0;
    }

    /* ── Right: breakdown ── */
    .breakdown-col {
      flex: 1;
      text-align: center;
      padding-left: 2rem;
    }

    .breakdown-grid {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      margin-top: 1.1rem;
      flex-wrap: wrap;
    }

    .b-item { text-align: center; }

    .b-item .ring-wrap .center-num {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .b-label {
      margin-top: .45rem;
      font-size: .63rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Footer ── */
    .card-footer {
      border-top: 1px solid #f1f5f9;
      padding: 1.2rem 2rem 1.4rem;
    }

    .footer-title {
      font-size: .9rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: .3rem;
    }

    .footer-body {
      font-size: .76rem;
      color: #94a3b8;
      line-height: 1.55;
    }

    .footer-body a {
      color: #00c9a7;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="page">
  <span class="star star-tl">✦</span>
  <span class="star star-br">✦</span>

  <div class="card">

    <!-- Header -->
    <div class="card-header">PROSPECTAI &nbsp;·&nbsp; SERVICE HEALTH</div>

    <!-- Body -->
    <div class="card-body">

      <!-- Overall Score -->
      <div class="score-col">
        <div class="col-title">Your Score</div>
        <div class="ring-wrap">
          <svg width="130" height="130" viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="54" fill="none" stroke="#eef2f7" stroke-width="9"/>
            <circle id="r-overall" cx="65" cy="65" r="54" fill="none" stroke-width="9"
              stroke-linecap="round" transform="rotate(-90 65 65)"
              stroke-dasharray="339.3" stroke-dashoffset="339.3"/>
          </svg>
          <span class="center-num" id="n-overall">—</span>
        </div>
        <div class="score-rating" id="lbl-rating">—</div>
        <div class="score-range"  id="lbl-range">—</div>
      </div>

      <div class="vdivider"></div>

      <!-- Breakdown -->
      <div class="breakdown-col">
        <div class="col-title">Your Breakdown</div>
        <div class="breakdown-grid">

          <!-- Performance -->
          <div class="b-item">
            <div class="ring-wrap">
              <svg width="82" height="82" viewBox="0 0 82 82">
                <circle cx="41" cy="41" r="34" fill="none" stroke="#eef2f7" stroke-width="7"/>
                <circle id="r-perf" cx="41" cy="41" r="34" fill="none" stroke-width="7"
                  stroke-linecap="round" transform="rotate(-90 41 41)"
                  stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
              </svg>
              <span class="center-num" id="n-perf">—</span>
            </div>
            <div class="b-label">Performance</div>
          </div>

          <!-- Database -->
          <div class="b-item">
            <div class="ring-wrap">
              <svg width="82" height="82" viewBox="0 0 82 82">
                <circle cx="41" cy="41" r="34" fill="none" stroke="#eef2f7" stroke-width="7"/>
                <circle id="r-db" cx="41" cy="41" r="34" fill="none" stroke-width="7"
                  stroke-linecap="round" transform="rotate(-90 41 41)"
                  stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
              </svg>
              <span class="center-num" id="n-db">—</span>
            </div>
            <div class="b-label">Database</div>
          </div>

          <!-- API -->
          <div class="b-item">
            <div class="ring-wrap">
              <svg width="82" height="82" viewBox="0 0 82 82">
                <circle cx="41" cy="41" r="34" fill="none" stroke="#eef2f7" stroke-width="7"/>
                <circle id="r-api" cx="41" cy="41" r="34" fill="none" stroke-width="7"
                  stroke-linecap="round" transform="rotate(-90 41 41)"
                  stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
              </svg>
              <span class="center-num" id="n-api">—</span>
            </div>
            <div class="b-label">API</div>
          </div>

          <!-- Response time -->
          <div class="b-item">
            <div class="ring-wrap">
              <svg width="82" height="82" viewBox="0 0 82 82">
                <circle cx="41" cy="41" r="34" fill="none" stroke="#eef2f7" stroke-width="7"/>
                <circle id="r-resp" cx="41" cy="41" r="34" fill="none" stroke-width="7"
                  stroke-linecap="round" transform="rotate(-90 41 41)"
                  stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
              </svg>
              <span class="center-num" id="n-resp" style="font-size:.75rem;letter-spacing:-.5px">—</span>
            </div>
            <div class="b-label">Latency</div>
          </div>

        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <div class="footer-title" id="f-title">Checking…</div>
      <div class="footer-body"  id="f-body">Please wait.</div>
    </div>

  </div><!-- .card -->
</div><!-- .page -->

<div id="_hd"
  data-status="{{ status }}"
  data-db="{{ db_status }}"
  data-ms="{{ response_ms }}"
  data-ts="{{ timestamp }}"
  style="display:none"></div>

<script>
  const _hd     = document.getElementById('_hd');
  const STATUS  = _hd.dataset.status;
  const DB      = _hd.dataset.db;
  const RESP_MS = parseFloat(_hd.dataset.ms);
  const TS      = _hd.dataset.ts;

  // ── Score helpers ──────────────────────────────────────────
  function perfScore(ms) {
    if (ms <  50)  return 100;
    if (ms < 100)  return 92;
    if (ms < 200)  return 82;
    if (ms < 350)  return 70;
    if (ms < 600)  return 55;
    if (ms < 1000) return 38;
    return 18;
  }

  function ringColor(s) {
    if (s >= 80) return "#00c9a7";
    if (s >= 60) return "#ff9f43";
    if (s >= 40) return "#f59e0b";
    return "#ff6b9d";
  }

  function ratingLabel(s) {
    if (s >= 80) return { text: "Excellent",  range: "Score range: 80–100" };
    if (s >= 60) return { text: "Good",       range: "Score range: 60–79"  };
    if (s >= 40) return { text: "Average",    range: "Score range: 40–59"  };
    return              { text: "Critical",   range: "Score range: 0–39"   };
  }

  // ── Animate a ring ─────────────────────────────────────────
  function animateRing(ringId, score, circ) {
    const el = document.getElementById(ringId);
    requestAnimationFrame(() => {
      el.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1), stroke .4s";
      el.style.stroke = ringColor(score);
      el.style.strokeDashoffset = circ * (1 - score / 100);
    });
  }

  function setNum(id, text, color) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.style.color = color;
  }

  // ── Main ───────────────────────────────────────────────────
  function render() {
    const perf   = perfScore(RESP_MS);
    const db     = DB === "healthy" ? 100 : 0;
    const api    = 100;
    const overall = Math.round(perf * 0.30 + db * 0.50 + api * 0.20);

    // Large ring (r=54, circ≈339.3)
    animateRing("r-overall", overall, 339.3);
    setNum("n-overall", overall, ringColor(overall));

    const { text, range } = ratingLabel(overall);
    const ratingEl = document.getElementById("lbl-rating");
    ratingEl.textContent = text;
    ratingEl.style.color = ringColor(overall);
    document.getElementById("lbl-range").textContent = range;

    // Small rings (r=34, circ≈213.6)
    animateRing("r-perf", perf, 213.6);
    setNum("n-perf", perf, ringColor(perf));

    animateRing("r-db", db, 213.6);
    setNum("n-db", db, ringColor(db));

    animateRing("r-api", api, 213.6);
    setNum("n-api", api, ringColor(api));

    animateRing("r-resp", perf, 213.6);
    setNum("n-resp", RESP_MS + "ms", ringColor(perf));

    // Footer
    const checked = new Date(TS).toLocaleString();
    if (STATUS === "healthy") {
      document.getElementById("f-title").textContent = "All systems operational.";
      document.getElementById("f-body").innerHTML =
        `ProspectAI is running smoothly. Database connected and API responding in <strong>${RESP_MS}ms</strong>. ` +
        `Last checked: ${checked}. &nbsp;<a href="/health/json">View JSON →</a>`;
    } else {
      document.getElementById("f-title").textContent = "Service is experiencing issues.";
      document.getElementById("f-body").innerHTML =
        `One or more components are degraded. Check the database connection. ` +
        `Last checked: ${checked}. &nbsp;<a href="/health/json">View JSON →</a>`;
    }
  }

  setTimeout(render, 80);
  setTimeout(() => location.reload(), 30000);
</script>
</body>
</html>
